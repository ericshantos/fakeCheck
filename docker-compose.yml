services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - fakecheck_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  python_service:
    image: eshantos/veritas_runtime:v2.0
    container_name: fakecheck_predictor
    ports:
      - "9000:9000"
    expose:
      - "9000"
    networks:
      - fakecheck_net
    restart: unless-stopped

  node_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fakecheck_gateway
    ports:
      - "3000:3000"
    expose:
      - "3000"
    networks:
      - fakecheck_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  fakecheck_net:
    driver: bridge

volumes:
  redis_data:
